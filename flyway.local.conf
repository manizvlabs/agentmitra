# Local Flyway Configuration for Testing
flyway.url=jdbc:postgresql://localhost:5432/agentmitra_flyway_test
flyway.user=manish
flyway.password=test_password
flyway.schemas=lic_schema
flyway.locations=filesystem:db/migration
